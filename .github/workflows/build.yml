name: Build NRO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec-tests:
    name: Codec tests (ASan and UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test framing and recovery
        run: make test HOST_CC=clang

  build-nro:
    name: Build and package Switch NRO
    needs: codec-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with pinned devkitPro toolchain
        run: sh build.sh
      - name: Validate NRO and package download
        run: python3 scripts/package.py
      - name: Upload NRO, checksum and notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ldn-relay-nro-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
