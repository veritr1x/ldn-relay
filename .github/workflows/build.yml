name: Build NRO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec-tests:
    name: Privacy and transport tests (ASan and UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host authentication test dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Check publishable source privacy
        run: python3 scripts/privacy_check.py
      - name: Test release guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test simulated BLE faults
        run: make ble-lab-test HOST_CC=clang
      - name: Test framing and recovery
        run: make test HOST_CC=clang

  apple-build:
    name: Build generic Mac companion
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify ad-hoc signature
        run: python3 relay/mac/build.py

  build-nro:
    name: Build and package Switch NRO
    needs: [codec-tests, apple-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with pinned devkitPro toolchain
        run: sh build.sh
      - name: Validate NRO and package download
        run: python3 scripts/package.py
      - name: Upload NRO, checksum and notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ldn-relay-nro-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Switch release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-nro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify this run's NRO
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$RUN_ID" --name "ldn-relay-nro-$COMMIT" --dir dist
          python3 scripts/release_assets.py dist dist-release --tag "$TAG" --commit "$COMMIT"
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist-release/* --verify-tag --prerelease \
            --title "LDN Relay $TAG" --notes-file RELEASE.md
