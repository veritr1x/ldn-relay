name: Build NRO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec-tests:
    name: Privacy and transport tests (ASan and UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host authentication test dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Check publishable source privacy
        run: python3 scripts/privacy_check.py
      - name: Test release guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test simulated BLE faults
        run: make ble-lab-test HOST_CC=clang
      - name: Test framing and recovery
        run: make test HOST_CC=clang

  apple-build:
    name: Build generic Mac companion
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify ad-hoc signature
        run: python3 relay/mac/build.py

  build-nro:
    name: Build and package Switch NRO
    needs: [codec-tests, apple-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with pinned devkitPro toolchain
        run: sh build.sh
      - name: Validate NRO and package download
        run: python3 scripts/package.py
      - name: Upload NRO, checksum and notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ldn-relay-nro-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
