name: Build NRO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec-tests:
    name: Codec tests (ASan and UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test framing and recovery
        run: make test HOST_CC=clang

  build-nro:
    name: Build and package Switch NRO
    needs: codec-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build with pinned devkitPro toolchain
        run: sh build.sh
      - name: Validate NRO and package download
        run: python3 scripts/package.py
      - name: Upload NRO, checksum and notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ldn-relay-nro-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
